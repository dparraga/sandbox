[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-photo"
version = "0.1.0"
description = "Offline HEIC candidate discovery for a dashboard photo organizer"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ExifRead==3.5.1", "Pillow==13.0.0", "pillow-heif==1.8.1"]

[project.scripts]
flex-photo = "flex_photo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flex_photo*"]
